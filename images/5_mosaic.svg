<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g transform="translate(80,55)">
    <!-- outer frame -->
    <rect x="0" y="0" width="240" height="160" rx="4" fill="none" stroke="#333333" stroke-width="2"/>

    <!-- Column 1 (wider category) -->
    <rect x="0" y="0" width="134" height="95" fill="#9D629D"/>
    <rect x="0" y="99" width="134" height="61" fill="#777777"/>

    <!-- Column 2 (narrower category) -->
    <rect x="138" y="0" width="102" height="46" fill="#9D629D"/>
    <rect x="138" y="50" width="102" height="110" fill="#777777"/>

    <!-- white gaps between tiles for mosaic separation -->
    <rect x="134" y="0" width="4" height="160" fill="#FFFFFF"/>
    <rect x="0" y="95" width="134" height="4" fill="#FFFFFF"/>
    <rect x="138" y="46" width="102" height="4" fill="#FFFFFF"/>
  </g>
</svg>
